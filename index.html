<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Use 'cover' if you want it to fill the screen without letterboxing */
    }
  </style>
</head>
<body>
  <img src="1.png" alt="Fullscreen Image">
</body>
</html>
